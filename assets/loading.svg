<svg xmlns="http://www.w3.org/2000/svg" width="700" height="260" viewBox="0 0 700 260">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#13306B"/><stop offset="1" stop-color="#0A1F44"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6D0F2A"/><stop offset="1" stop-color="#FF2E97"/></linearGradient>
    <g id="ball"><circle r="12" fill="#FFFFFF" stroke="#0A1F44" stroke-width="1.6"/><path d="M0,-5 L4.8,-1.5 L3,4 L-3,4 L-4.8,-1.5Z" fill="#0A1F44"/><path d="M0,-5 V-11 M4.8,-1.5 L10.5,-3.5 M3,4 L7,9.5 M-3,4 L-7,9.5 M-4.8,-1.5 L-10.5,-3.5" stroke="#0A1F44" stroke-width="1.4" stroke-linecap="round"/></g>
  </defs>
  <style>
    .roll{animation:roll 3.5s linear infinite;transform-box:fill-box;transform-origin:center}
    .dot{animation:dot 1.4s infinite}
    .h{animation:beat 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .flick{animation:flick 3.4s linear infinite}
    @keyframes roll{to{transform:rotate(360deg)}}
    @keyframes dot{0%,20%{opacity:.15}50%{opacity:1}100%{opacity:.15}}
    @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
    @keyframes flick{0%,100%{opacity:1}6%{opacity:.4}9%{opacity:1}55%{opacity:1}58%{opacity:.55}61%{opacity:1}}
    .big{font:700 34px 'Trebuchet MS','Segoe UI',Verdana,sans-serif;fill:#FFFFFF}
    .small{font:600 18px 'Trebuchet MS','Segoe UI',Verdana,sans-serif;fill:#FFB3D9}
  </style>
  <rect x="3" y="3" width="694" height="254" rx="28" fill="url(#card)"/>
  <rect class="flick" x="3" y="3" width="694" height="254" rx="28" fill="none" stroke="#FF2E97" stroke-width="3"/>
  <ellipse cx="160" cy="205" rx="70" ry="8" fill="#FF2E97" opacity=".35"/>
  <g transform="translate(160,122) scale(5.2)"><g class="roll"><use href="#ball"/></g></g>
  <g transform="translate(160,122)"><path class="h" d="M0,-4 C-2,-10 -12,-9 -12,-1 C-12,6 -4,9 0,14 C4,9 12,6 12,-1 C12,-9 2,-10 0,-4Z" fill="#FF2E97" transform="translate(58,-52) scale(1.1)"/></g>
  <text x="300" y="88" class="small">currently loading</text>
  <text x="300" y="132" class="big">SQL</text>
  <text x="372" y="132" class="big">.</text>
  <text x="388" y="132" class="big dot" style="animation-delay:.25s">.</text>
  <text x="404" y="132" class="big dot" style="animation-delay:.5s">.</text>
  <text x="300" y="168" class="small">next on the pitch: networks, databases</text>
  <text x="300" y="192" class="small">and a lot of stubbornness 💪</text>
  <rect x="300" y="212" width="340" height="12" rx="6" fill="#1B2F5E"/>
  <rect x="300" y="212" width="0" height="12" rx="6" fill="url(#bar)">
    <animate attributeName="width" dur="5s" repeatCount="indefinite" keyTimes="0;0.85;1" values="0;340;340"/>
  </rect>
</svg>
