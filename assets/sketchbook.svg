<path class="dr" pathLength="1" d="M470,85 L448,140 L478,140 L458,195 L512,120 L482,120 L500,85Z" stroke="#6D0F2A" style="animation-delay:1.6s" />

<path class="dr" pathLength="1" d="M610,90 L622,124 L658,126 L630,148 L640,184 L610,164 L580,184 L590,148 L562,126 L598,124Z" stroke="#FF2E97" style="animation-delay:2.2s" />

<path class="dr" pathLength="1" d="M690,100 H770 V160 H690Z M676,176 H784" stroke="#0A1F44" style="animation-delay:2.8s" />

  </g>
