<svg xmlns="http://www.w3.org/2000/svg" width="800" height="260" viewBox="0 0 800 260">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF0F6"/><stop offset="1" stop-color="#FFD3EA"/></linearGradient>
  </defs>
  <style>
    .dr{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 9s ease-in-out infinite}
    .tt{font:700 26px 'Trebuchet MS','Segoe UI',Verdana,sans-serif;fill:#0A1F44}
    .st{font:600 17px 'Trebuchet MS','Segoe UI',Verdana,sans-serif;fill:#6D0F2A}
    .cur{animation:blink 1s steps(2,start) infinite}
    @keyframes draw{0%{stroke-dashoffset:1}22%{stroke-dashoffset:0}85%{stroke-dashoffset:0}100%{stroke-dashoffset:1}}
    @keyframes blink{to{visibility:hidden}}
  </style>
  <rect x="3" y="3" width="794" height="254" rx="28" fill="url(#card)" stroke="#FF2E97" stroke-width="3"/>
  <text x="400" y="46" text-anchor="middle" class="tt">doodle mode: ON ✏️</text>
  <g transform="translate(0,20)">
<path class="dr" pathLength="1" d="M130,130 C100,95 60,110 80,145 C95,170 125,180 130,195 C135,180 165,170 180,145 C200,110 160,95 130,130Z" stroke="#FF2E97" style="animation-delay:0s" />

<path class="dr" pathLength="1" d="M300,130 m-42,0 a42,42 0 1,0 84,0 a42,42 0 1,0 -84,0" stroke="#0A1F44" style="animation-delay:0.6s" />

<path class="dr" pathLength="1" d="M300,110 L322,127 L314,152 L286,152 L278,127Z" stroke="#0A1F44" style="animation-delay:0.9s" />

