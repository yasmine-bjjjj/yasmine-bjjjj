<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#13306B"/><stop offset="1" stop-color="#0A1F44"/></linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#FF2E97"/></marker>
    <g id="ball"><circle r="12" fill="#FFFFFF" stroke="#0A1F44" stroke-width="1.6"/><path d="M0,-5 L4.8,-1.5 L3,4 L-3,4 L-4.8,-1.5Z" fill="#0A1F44"/><path d="M0,-5 V-11 M4.8,-1.5 L10.5,-3.5 M3,4 L7,9.5 M-3,4 L-7,9.5 M-4.8,-1.5 L-10.5,-3.5" stroke="#0A1F44" stroke-width="1.4" stroke-linecap="round"/></g>
  </defs>
  <style>
    .node{animation:glow 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .dash{animation:move 1.6s linear infinite}
    .flick{animation:flick 3.4s linear infinite}
    @keyframes glow{0%{opacity:.45;transform:scale(.94)}8%{opacity:1;transform:scale(1.14)}22%{opacity:1;transform:scale(1)}40%,100%{opacity:.45;transform:scale(.94)}}
    @keyframes move{to{stroke-dashoffset:-28}}
    @keyframes flick{0%,100%{opacity:1}6%{opacity:.4}9%{opacity:1}55%{opacity:1}58%{opacity:.55}61%{opacity:1}}
    .ttl{font:700 24px 'Trebuchet MS','Segoe UI',Verdana,sans-serif;fill:#FF2E97}
    .lab{font:700 18px 'Trebuchet MS','Segoe UI',Verdana,sans-serif;fill:#FFFFFF}
    .small{font:600 16px 'Trebuchet MS','Segoe UI',Verdana,sans-serif;fill:#FFB3D9}
  </style>
  <rect x="3" y="3" width="794" height="294" rx="28" fill="url(#card)"/>
  <rect class="flick" x="3" y="3" width="794" height="294" rx="28" fill="none" stroke="#FF2E97" stroke-width="3"/>
  <text x="400" y="44" text-anchor="middle" class="ttl">my debugging loop</text>
  <line class="dash" x1="206" y1="150" x2="336" y2="150" stroke="#FF2E97" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 12" marker-end="url(#arr)"/>
  <line class="dash" x1="456" y1="150" x2="586" y2="150" stroke="#FF2E97" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 12" marker-end="url(#arr)"/>
  <path class="dash" d="M650,240 C650,292 150,292 150,240" fill="none" stroke="#FFB3D9" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 12" opacity=".7"/>
  <text x="400" y="80" text-anchor="middle" class="small">next problem: repeat until it works ✨</text>
<g transform="translate(150,150)"><g class="node" style="animation-delay:0s"><circle r="50" fill="#1B2F5E" stroke="#FF2E97" stroke-width="4"/><text y="14" text-anchor="middle" style="font:40px 'Trebuchet MS','Segoe UI',Verdana,sans-serif">🐛</text></g></g>
<text x="150" y="232" text-anchor="middle" class="lab">bug appears</text>
<g transform="translate(400,150)"><g class="node" style="animation-delay:1.2s"><circle r="50" fill="#1B2F5E" stroke="#FF2E97" stroke-width="4"/><text y="14" text-anchor="middle" style="font:40px 'Trebuchet MS','Segoe UI',Verdana,sans-serif">💪</text></g></g>
<text x="400" y="232" text-anchor="middle" class="lab">try again</text>
<g transform="translate(650,150)"><g class="node" style="animation-delay:2.4s"><circle r="50" fill="#1B2F5E" stroke="#FF2E97" stroke-width="4"/><text y="14" text-anchor="middle" style="font:40px 'Trebuchet MS','Segoe UI',Verdana,sans-serif">✅</text></g></g>
<text x="650" y="232" text-anchor="middle" class="lab">fixed!</text>
  <g><use href="#ball"><animateMotion dur="6s" repeatCount="indefinite" path="M150,150 L400,150 L650,150 L650,240 C650,292 150,292 150,240 L150,150"/></use></g>
</svg>
